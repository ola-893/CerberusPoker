[workspace]
members = [
    "programs/cerberus_poker",
    "programs/texas_holdem",
]
resolver = "2"

[workspace.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "token_2022"] }
solana-program = "2.3.0"
solana-sha256-hasher = "2.3.0"
arcium-anchor = "0.4.0"
arcium-client = "0.4.0"
arcium-macros = "0.4.0"
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "3.0.0", features = ["no-entrypoint"] }
# Confidential transfer is an extension of spl-token-2022 (no separate crate needed)
# Use spl-token-2022 with the confidential-transfer feature for encrypted balances

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
# Patch zmij to work around Rust 1.89.0 compatibility issue
# zmij uses hint::select_unpredictable which doesn't exist in 1.89.0
# We replace it with a simple conditional
zmij = { path = "patches/zmij" }
