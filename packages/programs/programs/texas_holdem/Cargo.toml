[package]
name = "texas_holdem"
version = "0.1.0"
description = "Texas Hold'em reference implementation for CerberusPoker"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "texas_holdem"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "arcium-anchor/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "token_2022"] }
arcium-anchor = "0.4.0"
arcium-macros = "0.4.0"
arcium-client = { version = "0.4.0", default-features = false }
reflect-sdk = "1.0.0"

[dev-dependencies]
solana-program-test = "2.3.0"
solana-sdk = "2.3.0"
spl-token = { workspace = true }
tokio = { version = "1", features = ["full"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
