[package]
name = "cerberus_poker"
version = "0.1.0"
description = "Game-agnostic mental poker protocol program for CerberusPoker"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cerberus_poker"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
getrandom_01 = { package = "getrandom", version = "=0.1.16", features = ["dummy"] }
getrandom = { workspace = true }
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
arcium-anchor = "=0.9.7"
arcium-macros = "=0.9.7"
arcium-client = { version = "=0.9.7", default-features = false }
solana-sha256-hasher = { workspace = true }
# Force blake3 below the edition-2024 constant_time_eq transitive dep while
# Anchor's SBF toolchain is still Cargo 1.84.
blake3 = { workspace = true }
# Keep proc-macro-crate below the edition-2024 toml_datetime transitive dep
# for the same SBF toolchain compatibility reason.
proc-macro-crate = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
solana-program-test = "2.3.0"
solana-sdk = "2.3.0"
tokio = { version = "1", features = ["full"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
