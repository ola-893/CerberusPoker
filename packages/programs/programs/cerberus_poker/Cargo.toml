[package]
name = "cerberus_poker"
version = "0.1.0"
description = "Game-agnostic mental poker protocol program for CerberusPoker"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cerberus_poker"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build"]

[dependencies]
getrandom_01 = { package = "getrandom", version = "=0.1.16", features = ["dummy"] }
getrandom = { workspace = true }
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
arcium-anchor = "0.4.0"
arcium-macros = "0.4.0"
arcium-client = { version = "0.4.0", default-features = false }

[dev-dependencies]
solana-program-test = "2.3.0"
solana-sdk = "2.3.0"
tokio = { version = "1", features = ["full"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
